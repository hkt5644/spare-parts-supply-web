<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>수리부속 순환보급체계</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 얇은 유틸 바 → 흰 GNB(워드마크) → 좌측 메뉴(LNB) + 본문(제목·경로 → 단계 박스 → 안내 박스 → 업무 섹션). 무채색 + 남색 강조 */
:root{
  --bg:#ffffff; --surface:#ffffff; --th:#f6f7f8; --note:#f2f3f4; --ink:#05141f; --muted:#6b737a; --line:#dcdfe2; --line-strong:#05141f;
  --solid:#05141f; --solid-ink:#ffffff; --util:#05141f; --util-ink:#c9d0d6;
  --ok:#1f7a48; --ok-soft:#e3f2ea; --warn:#9a5d06; --warn-soft:#fcefd9;
  --crit:#c0221a; --crit-soft:#fde6e4; --info:#1f56a8; --info-soft:#e4edfa;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117; --surface:#0c1117; --th:#151c24; --note:#151c24; --ink:#e9edf1; --muted:#97a1ab; --line:#27303a; --line-strong:#c9d1d9;
    --solid:#e3e8ed; --solid-ink:#05141f; --util:#04090e; --util-ink:#97a1ab;
    --ok:#74c898; --ok-soft:#16301f; --warn:#e9b25c; --warn-soft:#352812;
    --crit:#f5877d; --crit-soft:#3a1b19; --info:#8ab4f0; --info-soft:#18283c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#0c1117; --th:#151c24; --note:#151c24; --ink:#e9edf1; --muted:#97a1ab; --line:#27303a; --line-strong:#c9d1d9;
  --solid:#e3e8ed; --solid-ink:#05141f; --util:#04090e; --util-ink:#97a1ab;
  --ok:#74c898; --ok-soft:#16301f; --warn:#e9b25c; --warn-soft:#352812;
  --crit:#f5877d; --crit-soft:#3a1b19; --info:#8ab4f0; --info-soft:#18283c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;letter-spacing:-.01em}
.in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 유틸 바 · GNB */
.util{background:var(--util);color:var(--util-ink);font-size:12px}
.util .in{display:flex;gap:24px;padding-block:8px;flex-wrap:wrap}
.gnb{border-bottom:1px solid var(--line)}
.gnb .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.mark b{font-weight:900;font-size:24px;letter-spacing:.06em}
.mark span{font-weight:500;font-size:20px}

/* 본문 골격 */
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:48px;padding-block:44px 72px}
.lnb{display:grid;gap:6px;align-content:start}
.lnb-i{appearance:none;font:inherit;background:none;border:0;color:var(--muted);display:flex;align-items:center;gap:12px;padding:12px 4px;text-align:left;cursor:pointer;font-size:15px;font-weight:500}
.lnb-i svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lnb-i:hover{color:var(--ink)}
.lnb-i[aria-current="page"]{color:var(--ink);font-weight:700}
.content{display:grid;gap:28px;min-width:0;align-content:start}

.ptop{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(24px,3vw,30px);font-weight:700;margin:0;letter-spacing:-.03em;text-wrap:balance}
.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.crumb span+span::before{content:"›";margin-right:8px}

/* 단계 박스 (분할 탭 형태) */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line-strong)}
.stage{appearance:none;font:inherit;color:var(--ink);background:var(--surface);text-align:center;cursor:pointer;display:grid;gap:1px;justify-items:center;
  border:0;border-left:1px solid var(--line);padding:14px 8px 16px}
.stage:first-child{border-left:0}
.stage:hover{background:var(--th)}
.stage .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.stage .n{font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stage .l{font-weight:700;font-size:14px}
.stage .s{font-size:11.5px;color:var(--muted);line-height:1.4}
.stage.hot{background:var(--solid);color:var(--solid-ink)}
.stage.hot .k,.stage.hot .s{color:var(--solid-ink);opacity:.72}

/* 안내 박스 */
.note{background:var(--note);padding:18px 22px;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.note strong{color:var(--ink);font-weight:500}
.note ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.note li{padding-left:12px;position:relative}
.note li::before{content:"·";position:absolute;left:0}

/* 섹션 */
.panel{display:grid;gap:36px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:36px 32px;align-items:start}
.card{display:grid;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head > div{display:grid;gap:4px;min-width:0}
h2{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2::before{content:"";width:7px;height:7px;border-top:2.5px solid var(--ink);border-right:2.5px solid var(--ink);transform:rotate(45deg);flex:none;margin-left:-2px}
.hint{margin:0;color:var(--muted);font-size:13.5px}

.formula{font-family:var(--font-mono);font-size:13px;background:var(--note);padding:12px 16px;overflow-x:auto;white-space:nowrap}

.tbl{overflow-x:auto;border-top:2px solid var(--line-strong)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:13px;color:var(--ink);font-weight:700;text-align:center;padding:11px 12px;background:var(--th);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
td.l{text-align:left}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
th.num{text-align:right}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

.chip{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-mute{background:var(--note);color:var(--muted)}

.meter{position:relative;height:6px;background:var(--note);min-width:90px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.meter i.p{background:var(--info);opacity:.35}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter.warn i:not(.p){background:var(--warn)}
.meter.crit i:not(.p){background:var(--crit)}

.cell-in{width:64px;font:inherit;font-size:14px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink)}

.btn{font:inherit;font-weight:500;font-size:14px;padding:10px 22px;border-radius:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--th)}
.btn.primary{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.btn.primary:hover{opacity:.88;background:var(--solid)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:focus-visible,.lnb-i:focus-visible,.stage:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* 입력 표 (라벨 칸 + 입력 칸) */
.frm{border-top:2px solid var(--line-strong)}
.row{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--line)}
.row > span{background:var(--th);padding:12px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center}
.row > select,.row > input{margin:8px 12px}
select,input[type="text"],input[type="number"]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:8px 10px;width:auto;min-width:0}
.row > select,.row > input[type="text"]{width:calc(100% - 24px)}
.row > input[type="number"]{width:110px}
.frm-act{display:flex;justify-content:flex-end;margin-top:16px}

.msg{font-size:13.5px;padding:12px 16px;margin:0}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.crit{background:var(--crit-soft);color:var(--crit)}
.msg.info{background:var(--info-soft);color:var(--info)}

.docs{display:grid;gap:12px}
.doc{border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;background:var(--surface)}
.doc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc-h .id{font-family:var(--font-mono);font-weight:500;font-size:14px}
.doc ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.doc li{display:flex;justify-content:space-between;gap:12px}
.doc li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);font-size:14px;margin:0;padding:28px 16px;text-align:center;border-top:2px solid var(--line-strong);border-bottom:1px solid var(--line)}

.log{list-style:none;margin:0;padding:0;display:grid;border-top:2px solid var(--line-strong)}
.log li{display:grid;grid-template-columns:96px 84px minmax(0,1fr);gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:24px;padding-block:20px 56px}
  .lnb{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
  .lnb-i{padding:10px 12px;white-space:nowrap;border-bottom:2px solid transparent}
  .lnb-i[aria-current="page"]{border-bottom-color:var(--ink)}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage:nth-child(4){border-left:0}
  .stage:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:520px){
  .gnb .in{padding-block:16px}
  .mark b{font-size:20px} .mark span{font-size:16px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:nth-child(odd){border-left:0} .stage:nth-child(4){border-left:1px solid var(--line)}
  .stage:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:92px minmax(0,1fr)}
  .row > span{padding:12px}
  .log li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="util"><div class="in"><span>기획 검증용 프로토타입</span><span>모든 부대·품목·수량은 가상 데이터</span></div></div>
<header class="gnb">
  <div class="in">
    <div class="mark"><b>PARTS</b><span>정비보급센터</span></div>
    <button class="btn sm" data-act="reset" type="button">처음 상태로</button>
  </div>
</header>
<div class="in">
  <div class="shell">
    <nav class="lnb" id="tabs" aria-label="역할 메뉴"></nav>
    <div class="content">
      <div class="ptop">
        <h1 id="ptitle">정비부대</h1>
        <div class="crumb" id="crumb"></div>
      </div>
      <nav class="flow" id="flow" aria-label="보급 흐름 단계"></nav>
      <div class="note">
        <strong>※ 수리부속 순환보급 안내</strong>
        <ul>
          <li>정비부대가 부속을 쓰면 물류대대 재고가 줄고, 정수에 못 미치는 만큼 중앙 물류에 자동 청구됩니다.</li>
          <li>중앙에 없는 부속은 조달로 넘어가고, 입고되면 밀린 청구에 자동 배분됩니다.</li>
          <li>위 단계 박스나 왼쪽 메뉴를 눌러 흐름을 따라가 보세요. 진하게 표시된 단계는 처리할 일이 있다는 뜻입니다.</li>
        </ul>
      </div>
      <main class="panel" id="panel"></main>
    </div>
  </div>
</div>

<script>
const KEY = 'spare-flow-v1';
const EQUIP = ['전술차량 A형 (가상-101)', '전술차량 B형 (가상-207)', '발전기 10kW (가상-G03)', '지게차 3톤 (가상-F12)'];
const TABS = [
  {id:'unit', label:'정비부대', title:'정비 사용 등록', icon:'M14.7 6.3a4 4 0 0 0-5.2 5.2L4 17v3h3l5.5-5.5a4 4 0 0 0 5.2-5.2l-2.5 2.5-2.2-.5-.5-2.2z'},
  {id:'bn', label:'중간 물류대대', title:'재고 · 정수 관리', icon:'M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z M3 7.5l9 4.5 9-4.5 M12 12v9'},
  {id:'central', label:'중앙 물류', title:'중앙 출고 처리', icon:'M4 21V8l8-5 8 5v13 M9 21v-6h6v6 M9 10h.01 M15 10h.01'},
  {id:'proc', label:'조달', title:'조달 요청 관리', icon:'M3 4h2.5l2.2 11h10.6L20.5 7H6.4 M9.5 20h.01 M17 20h.01'},
  {id:'log', label:'처리 이력', title:'처리 이력', icon:'M9 6h11 M9 12h11 M9 18h11 M4.5 6h.01 M4.5 12h.01 M4.5 18h.01'}
];

function seed(){
  const P = (id,nsn,name,unit,lead,monthly,onHand,pending,auth,rop,central) => ({id,nsn,name,unit,lead,monthly,onHand,pending,auth,rop,central});
  return {
    seq:{req:1, shp:1, prc:1, use:3},
    parts:[
      P('P01','2940-00-000-0101','엔진오일 필터','EA',14,18,9,0,30,12,40),
      P('P02','2910-00-000-0102','연료 필터','EA',30,9,10,0,24,10,0),
      P('P03','2530-00-000-0103','브레이크 패드','SET',21,6,4,0,16,6,5),
      P('P04','6140-00-000-0104','배터리 12V 100Ah','EA',10,4,3,6,10,4,12),
      P('P05','2610-00-000-0105','타이어 335/80R20','EA',45,5,20,0,20,8,30),
      P('P06','3030-00-000-0106','팬벨트','EA',14,7,11,0,18,6,25),
      P('P07','4720-00-000-0107','유압 호스 1/2"','EA',60,3,3,8,12,4,0),
      P('P08','6220-00-000-0108','전조등 어셈블리','EA',20,4,9,0,14,5,8)
    ],
    usage:[
      {id:'USE-001', t:'10-24 09:12', equip:EQUIP[0], partId:'P01', qty:4, note:'엔진오일 교환'},
      {id:'USE-002', t:'10-24 15:40', equip:EQUIP[2], partId:'P02', qty:2, note:'연료계통 점검'},
      {id:'USE-003', t:'10-25 10:05', equip:EQUIP[1], partId:'P03', qty:2, note:'제동장치 정비'}
    ],
    reqs:[
      {id:'REQ-001', t:'10-23 06:00', type:'자동', status:'처리중', lines:[
        {partId:'P04', qty:6, issued:6, backorder:0, received:0},
        {partId:'P07', qty:8, issued:0, backorder:8, received:0}
      ]}
    ],
    shipments:[{id:'SHP-001', t:'10-24 13:30', reqId:'REQ-001', partId:'P04', qty:6, status:'수송중'}],
    procs:[{id:'PRC-001', t:'10-24 13:30', partId:'P07', qty:8, status:'계약진행', refs:['REQ-001']}],
    log:[
      {t:'10-23 06:00', who:'물류대대', msg:'자동 청구 REQ-001 생성: 배터리 12V 100Ah 6EA, 유압 호스 1/2" 8EA'},
      {t:'10-23 08:20', who:'물류대대', msg:'REQ-001 확인 후 중앙 물류로 전송'},
      {t:'10-24 09:12', who:'정비부대', msg:'전술차량 A형 정비: 엔진오일 필터 4EA 불출'},
      {t:'10-24 13:30', who:'중앙 물류', msg:'REQ-001 출고 처리: 배터리 6EA 출고(SHP-001), 유압 호스 8EA 미결 → 조달요청 PRC-001'},
      {t:'10-24 15:40', who:'정비부대', msg:'발전기 10kW 정비: 연료 필터 2EA 불출'},
      {t:'10-24 16:00', who:'조달', msg:'PRC-001 계약 진행'},
      {t:'10-25 10:05', who:'정비부대', msg:'전술차량 B형 정비: 브레이크 패드 2SET 불출'}
    ]
  };
}

let S, tab = 'unit', flash = {}, form = {equip:EQUIP[0], part:'P01'};
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); return; } } catch(e) {}
  S = seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const pad = n => String(n).padStart(2,'0');
const now = () => { const d = new Date(); return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const part = id => S.parts.find(p => p.id === id);
const docNo = (k, prefix) => `${prefix}-${String(++S.seq[k]).padStart(3,'0')}`;
const log = (who, msg) => S.log.push({t:now(), who, msg});
const need = p => p.onHand + p.pending <= p.rop;
const recommend = p => Math.ceil(p.monthly / 30 * (p.lead + 15));

function stockState(p){
  if (p.onHand === 0) return {label:'결품', c:'crit'};
  if (need(p)) return {label:'청구 필요', c:'warn'};
  if (p.onHand <= p.rop) return {label:'보충 대기', c:'info'};
  return {label:'정상', c:'ok'};
}
const REQ_C = {'확인대기':'warn','중앙접수':'info','처리중':'info','완료':'ok','취소':'mute'};
const PRC_C = {'요청':'warn','계약진행':'info','입고완료':'ok'};
const chip = (label, c) => `<span class="chip c-${c}">${label}</span>`;

/* ---------- 업무 로직 ---------- */
function useParts(equip, partId, qty, note){
  const p = part(partId);
  if (!(qty > 0)) { flash.unit = {c:'crit', t:'수량을 1 이상으로 입력하세요.'}; return; }
  if (qty > p.onHand) {
    flash.unit = {c:'crit', t:`대대 보유량(${p.onHand}${p.unit})보다 많이 불출할 수 없습니다. 물류대대에 긴급 청구가 필요합니다.`};
    return;
  }
  const wasNeed = need(p);
  p.onHand -= qty;
  S.usage.push({id:docNo('use','USE'), t:now(), equip, partId, qty, note});
  log('정비부대', `${equip.split(' (')[0]} 정비: ${p.name} ${qty}${p.unit} 불출${note ? ` (${note})` : ''}`);
  let t = `${p.name} ${qty}${p.unit} 불출 완료. 대대 보유 ${p.onHand}${p.unit}.`;
  if (!wasNeed && need(p)) t += ` 재청구점(${p.rop}) 이하가 되어 다음 자동 청구에 포함됩니다.`;
  flash.unit = {c: need(p) ? 'warn' : 'ok', t};
}

function autoReq(){
  const lines = S.parts.filter(need)
    .map(p => ({partId:p.id, qty:p.auth - (p.onHand + p.pending), issued:0, backorder:0, received:0}))
    .filter(l => l.qty > 0);
  if (!lines.length) { flash.bn = {c:'info', t:'모든 품목이 재청구점보다 많아 청구할 품목이 없습니다.'}; return; }
  lines.forEach(l => part(l.partId).pending += l.qty);
  const id = docNo('req','REQ');
  S.reqs.push({id, t:now(), type:'자동', status:'확인대기', lines});
  log('물류대대', `자동 청구 ${id} 생성: ${lines.map(l => `${part(l.partId).name} ${l.qty}${part(l.partId).unit}`).join(', ')}`);
  flash.bn = {c:'ok', t:`${id} 생성 (${lines.length}개 품목). 아래 '확인 대기 청구'에서 확인하면 중앙 물류로 전송됩니다.`};
}

function confirmReq(id){
  const r = S.reqs.find(x => x.id === id);
  r.status = '중앙접수';
  log('물류대대', `${id} 확인 후 중앙 물류로 전송`);
  flash.bn = {c:'ok', t:`${id}를 중앙 물류로 보냈습니다. '중앙 물류' 메뉴에서 출고 처리할 수 있습니다.`};
}

function cancelReq(id){
  const r = S.reqs.find(x => x.id === id);
  r.status = '취소';
  r.lines.forEach(l => { const p = part(l.partId); p.pending = Math.max(0, p.pending - l.qty); });
  log('물류대대', `${id} 취소 (청구중 수량 원복)`);
  flash.bn = {c:'info', t:`${id}를 취소했습니다. 청구중 수량이 원래대로 돌아갔습니다.`};
}

function ship(reqId, partId, qty){
  const id = docNo('shp','SHP');
  S.shipments.push({id, t:now(), reqId, partId, qty, status:'수송중'});
  return id;
}

function addProc(partId, qty, reqId){
  const open = S.procs.find(x => x.partId === partId && x.status === '요청');
  if (open) { open.qty += qty; if (!open.refs.includes(reqId)) open.refs.push(reqId); return open.id; }
  const id = docNo('prc','PRC');
  S.procs.push({id, t:now(), partId, qty, status:'요청', refs:[reqId]});
  return id;
}

function processReq(id){
  const r = S.reqs.find(x => x.id === id);
  const out = [];
  r.lines.forEach(l => {
    const p = part(l.partId);
    const give = Math.min(p.central, l.qty);
    p.central -= give;
    l.issued = give;
    l.backorder = l.qty - give;
    if (give > 0) out.push(`${p.name} ${give}${p.unit} 출고(${ship(r.id, p.id, give)})`);
    if (l.backorder > 0) out.push(`${p.name} ${l.backorder}${p.unit} 미결 → 조달요청 ${addProc(p.id, l.backorder, r.id)}`);
  });
  r.status = '처리중';
  log('중앙 물류', `${id} 출고 처리: ${out.join(', ')}`);
  const bo = r.lines.filter(l => l.backorder > 0).length;
  flash.central = {c: bo ? 'warn' : 'ok', t:`${id} 처리 완료. 출고 ${r.lines.filter(l => l.issued > 0).length}건, 미결 ${bo}건${bo ? ' (조달 메뉴로 넘어갔습니다)' : ''}.`};
}

function allocate(partId){
  const p = part(partId);
  const out = [];
  S.reqs.filter(r => r.status === '처리중').forEach(r => {
    r.lines.filter(l => l.partId === partId && l.backorder > 0).forEach(l => {
      const give = Math.min(p.central, l.backorder);
      if (give <= 0) return;
      p.central -= give; l.backorder -= give; l.issued += give;
      out.push(`${r.id}에 ${give}${p.unit} 출고(${ship(r.id, partId, give)})`);
    });
  });
  if (out.length) log('중앙 물류', `${p.name} 미결 자동 배분: ${out.join(', ')}`);
  return out.length;
}

function advanceProc(id){
  const x = S.procs.find(q => q.id === id);
  const p = part(x.partId);
  if (x.status === '요청') {
    x.status = '계약진행';
    log('조달', `${id} 계약 진행 (${p.name} ${x.qty}${p.unit})`);
    flash.proc = {c:'info', t:`${id} 계약을 진행합니다. 납품되면 '입고 처리'를 누르세요.`};
  } else if (x.status === '계약진행') {
    x.status = '입고완료';
    p.central += x.qty;
    log('조달', `${id} 납품: 중앙 물류 ${p.name} ${x.qty}${p.unit} 입고`);
    const n = allocate(p.id);
    flash.proc = {c:'ok', t:`${p.name} ${x.qty}${p.unit} 중앙 입고. 미결 청구 ${n}건에 자동 배분되어 물류대대로 출고되었습니다.`};
  }
}

function receive(id){
  const s = S.shipments.find(x => x.id === id);
  const p = part(s.partId);
  const r = S.reqs.find(x => x.id === s.reqId);
  const l = r.lines.find(x => x.partId === s.partId);
  s.status = '수령완료';
  p.onHand += s.qty;
  p.pending = Math.max(0, p.pending - s.qty);
  l.received += s.qty;
  let t = `${p.name} ${s.qty}${p.unit} 수령. 대대 보유 ${p.onHand}${p.unit}.`;
  if (r.lines.every(x => x.received >= x.qty)) { r.status = '완료'; t += ` ${r.id} 청구가 모두 충족되었습니다.`; }
  log('물류대대', `${s.id} 수령 확인: ${p.name} ${s.qty}${p.unit} 입고 (${r.id})`);
  flash.bn = {c:'ok', t};
}

    {tab:'bn', n:S.reqs.filter(r => r.status === '확인대기').length, l:'확인 대기 청구', s:'물류대대 담당자 확인', hot:true},
    {tab:'central', n:S.reqs.filter(r => r.status === '중앙접수').length, l:'중앙 미처리', s:'출고 처리 전 청구', hot:true},

  document.getElementById('ptitle').textContent = cur.title;

function reqLines(r, mode){
  return `<ul>${r.lines.map(l => {
    const p = part(l.partId);
    let right = `${l.qty}${p.unit}`;
    if (mode === 'central') right = `청구 ${l.qty} · 중앙 보유 ${p.central}`;
    if (mode === 'progress') right = `수령 ${l.received}/${l.qty}${l.backorder ? ` · 미결 ${l.backorder}` : ''}`;
    return `<li><span>${esc(p.name)}</span><span>${right}</span></li>`;
  }).join('')}</ul>`;
}

function panelBn(){

      ${msg('bn')}
      <div class="tbl"><table><thead><tr><th>품번(가상)</th><th>품명</th><th class="num">보유</th><th class="num">청구중</th><th class="num">정수</th><th class="num">재청구점</th><th class="num">추천 정수</th><th>보유율</th><th>상태</th></tr></thead><tbody>${inv}</tbody></table></div>
    </section>
    <div class="grid2">
      <section class="card">
        <div class="head"><div><h2>확인 대기 청구</h2><p class="hint">자동 생성된 청구서를 담당자가 확인해야 중앙으로 넘어갑니다.</p></div></div>

        </div>`).join('')}</div>` : `<p class="empty">대기 중인 청구가 없습니다. 위에서 '자동 청구 실행'을 눌러 보세요.</p>`}

function panelProc(){
  const rows = S.procs.slice().reverse().map(x => {
    const p = part(x.partId);
    const btn = x.status === '요청' ? `<button class="btn sm" type="button" data-act="proc" data-id="${x.id}">계약 진행</button>`
      : x.status === '계약진행' ? `<button class="btn primary sm" type="button" data-act="proc" data-id="${x.id}">입고 처리</button>` : '';
    return `<tr><td class="mono">${x.id}</td><td class="mono">${x.t}</td><td class="l">${esc(p.name)}</td><td class="num">${x.qty}${p.unit}</td>
      <td class="mono">${x.refs.join(', ')}</td><td>${chip(x.status, PRC_C[x.status])}</td><td>${btn}</td></tr>`;
  }).join('');
  return `<section class="card">
    <div class="head"><div><h2>조달 요청</h2><p class="hint">같은 품목의 부족분은 '요청' 단계에 있는 동안 한 건으로 합쳐집니다. 입고 처리하면 중앙 재고에 더해지고 미결 청구로 자동 배분됩니다.</p></div></div>
    ${msg('proc')}
    ${rows ? `<div class="tbl"><table><thead><tr><th>문서번호</th><th>생성</th><th>품명</th><th class="num">수량</th><th>관련 청구</th><th>상태</th><th>처리</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty">조달 요청이 없습니다.</p>`}
  </section>`;
}

function panelLog(){
  return `<section class="card">
    <div class="head"><div><h2>처리 이력</h2><p class="hint">누가 언제 무엇을 했는지 최신순으로 보여줍니다. 실제 시스템에서는 감사 기록으로 쓰입니다.</p></div></div>
    <ul class="log">${S.log.slice().reverse().map(x => `<li><span class="mono">${x.t}</span><span>${chip(x.who, 'mute')}</span><span>${esc(x.msg)}</span></li>`).join('')}</ul>
  </section>`;
}

function render(){
  renderFlow(); renderTabs();
  const P = {unit:panelUnit, bn:panelBn, central:panelCentral, proc:panelProc, log:panelLog};
  document.getElementById('panel').innerHTML = P[tab]();
}

function go(t){
  tab = t; flash = {};
  try { history.replaceState(null, '', '#' + t); } catch(e) {}
  render();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { go(t.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const {act, id} = b.dataset;
  flash = {};
  if (act === 'reset') { S = seed(); flash.unit = {c:'info', t:'처음 상태로 되돌렸습니다.'}; tab = 'unit'; }
  if (act === 'auto') autoReq();
  if (act === 'confirm') confirmReq(id);
  if (act === 'cancel') cancelReq(id);
  if (act === 'process') processReq(id);
  if (act === 'proc') advanceProc(id);
  if (act === 'receive') receive(id);
  save(); render();
});

document.addEventListener('submit', e => {
  if (e.target.id !== 'useForm') return;
  e.preventDefault();
  form.equip = document.getElementById('f-equip').value;
  form.part = document.getElementById('f-part').value;
  flash = {};
  useParts(form.equip, form.part, parseInt(document.getElementById('f-qty').value, 10), document.getElementById('f-note').value.trim());
  save(); render();
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-equip') form.equip = el.value;
  if (el.id === 'f-part') form.part = el.value;
  if (!el.dataset.edit) return;
  const p = part(el.dataset.id);
  const v = parseInt(el.value, 10);
  flash = {};
  const next = {auth:p.auth, rop:p.rop, [el.dataset.edit]:v};
  if (!Number.isFinite(v) || v < 0 || next.auth < 1) flash.bn = {c:'crit', t:'0 이상의 숫자를 입력하세요. 정수는 1 이상이어야 합니다.'};
  else if (next.rop >= next.auth) flash.bn = {c:'crit', t:`재청구점(${next.rop})은 정수(${next.auth})보다 작아야 합니다.`};
  else {
    p[el.dataset.edit] = v;
    log('물류대대', `${p.name} ${el.dataset.edit === 'auth' ? '정수' : '재청구점'} 변경 → ${v}`);
    flash.bn = {c:'ok', t:`${p.name} ${el.dataset.edit === 'auth' ? '정수' : '재청구점'}를 ${v}(으)로 바꿨습니다.`};
  }
  save(); render();
});

load();
const h = location.hash.slice(1);
if (TABS.some(t => t.id === h)) tab = h;
render();
</script>

</body>
</html>

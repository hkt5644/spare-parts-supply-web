<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수리부속 순환보급체계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 얇은 유틸 바 → 흰 GNB(워드마크·사용자) → 좌측 메뉴(LNB) + 본문(제목·경로 → 단계 박스 → 안내 박스 → 업무 섹션). 무채색 + 남색 강조 */
:root{
  --bg:#ffffff; --surface:#ffffff; --th:#f6f7f8; --note:#f2f3f4; --ink:#05141f; --muted:#6b737a; --line:#dcdfe2; --line-strong:#05141f;
  --solid:#05141f; --solid-ink:#ffffff; --util:#05141f; --util-ink:#c9d0d6;
  --ok:#1f7a48; --ok-soft:#e3f2ea; --warn:#9a5d06; --warn-soft:#fcefd9;
  --crit:#c0221a; --crit-soft:#fde6e4; --info:#1f56a8; --info-soft:#e4edfa;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117; --surface:#0c1117; --th:#151c24; --note:#151c24; --ink:#e9edf1; --muted:#97a1ab; --line:#27303a; --line-strong:#c9d1d9;
    --solid:#e3e8ed; --solid-ink:#05141f; --util:#04090e; --util-ink:#97a1ab;
    --ok:#74c898; --ok-soft:#16301f; --warn:#e9b25c; --warn-soft:#352812;
    --crit:#f5877d; --crit-soft:#3a1b19; --info:#8ab4f0; --info-soft:#18283c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#0c1117; --th:#151c24; --note:#151c24; --ink:#e9edf1; --muted:#97a1ab; --line:#27303a; --line-strong:#c9d1d9;
  --solid:#e3e8ed; --solid-ink:#05141f; --util:#04090e; --util-ink:#97a1ab;
  --ok:#74c898; --ok-soft:#16301f; --warn:#e9b25c; --warn-soft:#352812;
  --crit:#f5877d; --crit-soft:#3a1b19; --info:#8ab4f0; --info-soft:#18283c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;letter-spacing:-.01em}
body.busy{cursor:progress}
.in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 유틸 바 · GNB */
.util{background:var(--util);color:var(--util-ink);font-size:12px}
.util .in{display:flex;gap:24px;padding-block:8px;flex-wrap:wrap}
.gnb{border-bottom:1px solid var(--line)}
.gnb .in{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:22px;flex-wrap:wrap}
.mark{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.mark b{font-weight:900;font-size:24px;letter-spacing:.06em}
.mark span{font-weight:500;font-size:20px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.who .email{color:var(--muted)}

/* 본문 골격 */
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:48px;padding-block:44px 72px}
.lnb{display:grid;gap:6px;align-content:start}
.lnb-i{appearance:none;font:inherit;background:none;border:0;color:var(--muted);display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:15px;font-weight:500;transition:background-color .15s,color .15s}
.lnb-i svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lnb-i:hover{background:var(--th);color:var(--ink)}
.lnb-i:active{background:var(--line)}
.lnb-i[aria-current="page"]{background:var(--solid);color:var(--solid-ink);font-weight:700}
.content{display:grid;gap:28px;min-width:0;align-content:start}

.ptop{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(24px,3vw,30px);font-weight:700;margin:0;letter-spacing:-.03em;text-wrap:balance}
.crumb{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.crumb span+span::before{content:"›";margin-right:8px}

/* 단계 박스 */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line-strong)}
.stage{appearance:none;font:inherit;color:var(--ink);background:var(--surface);text-align:center;cursor:pointer;display:grid;gap:1px;justify-items:center;
  border:0;border-left:1px solid var(--line);padding:14px 8px 16px;transition:background-color .15s,color .15s}
.stage:first-child{border-left:0}
.stage:hover{background:var(--th)}
.stage:active{background:var(--line)}
.stage .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.stage .n{font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.stage .l{font-weight:700;font-size:14px}
.stage .s{font-size:11.5px;color:var(--muted);line-height:1.4}
/* 처리할 일이 있는 단계: 위쪽 빨간 선 + 빨간 숫자 */
.stage.hot{box-shadow:inset 0 3px 0 var(--crit)}
.stage.hot .n{color:var(--crit)}
/* 선택한 단계: 남색 바탕 */
.stage.sel,.stage.sel:hover{background:var(--solid);color:var(--solid-ink)}
.stage.sel .k,.stage.sel .s{color:var(--solid-ink);opacity:.72}
.stage.sel .n{color:var(--solid-ink)}

/* 안내 박스 */
.note{background:var(--note);padding:18px 22px;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
.note strong{color:var(--ink);font-weight:500}
.note ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.note li{padding-left:12px;position:relative}
.note li::before{content:"·";position:absolute;left:0}

/* 섹션 */
.panel{display:grid;gap:36px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:36px 32px;align-items:start}
.card{display:grid;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head > div{display:grid;gap:4px;min-width:0}
h2{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2::before{content:"";width:7px;height:7px;border-top:2.5px solid var(--ink);border-right:2.5px solid var(--ink);transform:rotate(45deg);flex:none;margin-left:-2px}
.hint{margin:0;color:var(--muted);font-size:13.5px}

.formula{font-family:var(--font-mono);font-size:13px;background:var(--note);padding:12px 16px;overflow-x:auto;white-space:nowrap}

.tbl{overflow-x:auto;border-top:2px solid var(--line-strong)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:13px;color:var(--ink);font-weight:700;text-align:center;padding:11px 12px;background:var(--th);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center}
td.l{text-align:left}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
th.num{text-align:right}
.mono{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}

.chip{display:inline-block;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-crit{background:var(--crit-soft);color:var(--crit)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-mute{background:var(--note);color:var(--muted)}

.meter{position:relative;height:6px;background:var(--note);min-width:90px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.meter i.p{background:var(--info);opacity:.35}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter.warn i:not(.p){background:var(--warn)}
.meter.crit i:not(.p){background:var(--crit)}

.tbl input[type="text"]{width:100%;min-width:110px;padding:5px 8px}
.tbl input.w-unit{min-width:56px;width:64px}
.tbl tr.new td{background:var(--th)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
.tbl input[disabled]{opacity:.55;cursor:not-allowed}
.cell-in{width:64px;font:inherit;font-size:14px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink)}

.btn{font:inherit;font-weight:500;font-size:14px;padding:10px 22px;border-radius:0;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--th)}
.btn.primary{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}
.btn.primary:hover{opacity:.88;background:var(--solid)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn[disabled],.cell-in[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.lnb-i:focus-visible,.stage:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--info);outline-offset:2px}

/* 입력 표 */
.frm{border-top:2px solid var(--line-strong)}
.row{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--line)}
.row > span{background:var(--th);padding:12px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center}
.row > select,.row > input{margin:8px 12px}
select,input[type="text"],input[type="number"],input[type="email"],input[type="password"]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:8px 10px;width:auto;min-width:0}
.row > select,.row > input[type="text"],.row > input[type="email"],.row > input[type="password"]{width:calc(100% - 24px)}
.row > input[type="number"]{width:110px}
.frm-act{display:flex;justify-content:flex-end;margin-top:16px}
fieldset{border:0;margin:0;padding:0;min-width:0}

.msg{font-size:13.5px;padding:12px 16px;margin:0}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.crit{background:var(--crit-soft);color:var(--crit)}
.msg.info{background:var(--info-soft);color:var(--info)}

.docs{display:grid;gap:12px}
.doc{border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px;background:var(--surface)}
.doc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc-h .id{font-family:var(--font-mono);font-weight:500;font-size:14px}
.doc ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.doc li{display:flex;justify-content:space-between;gap:12px}
.doc li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);font-size:14px;margin:0;padding:28px 16px;text-align:center;border-top:2px solid var(--line-strong);border-bottom:1px solid var(--line)}

.log{list-style:none;margin:0;padding:0;display:grid;border-top:2px solid var(--line-strong)}
.log li{display:grid;grid-template-columns:96px 84px minmax(0,1fr);gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}

/* 로그인 · 승인 대기 */
.gate{max-width:560px;margin:0 auto;padding-block:64px 96px;display:grid;gap:20px}
.gate h1{font-size:26px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:24px;padding-block:20px 56px}
  .lnb{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
  .lnb-i{padding:10px 12px;white-space:nowrap}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stage:nth-child(4){border-left:0}
  .stage:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:520px){
  .gnb .in{padding-block:16px}
  .mark b{font-size:20px} .mark span{font-size:16px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage:nth-child(odd){border-left:0} .stage:nth-child(4){border-left:1px solid var(--line)}
  .stage:nth-child(n+3){border-top:1px solid var(--line)}
  .row{grid-template-columns:92px minmax(0,1fr)}
  .row > span{padding:12px}
  .log li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="util"><div class="in"><span>기획 검증용 프로토타입</span><span>모든 부대·품목·수량은 가상 데이터</span></div></div>
<header class="gnb">
  <div class="in">
    <div class="mark"><b>PARTS</b><span>정비보급센터</span></div>
    <div class="who" id="who"></div>
  </div>
</header>

<div class="in" id="gateWrap"><div class="gate" id="gate"><p class="hint">불러오는 중…</p></div></div>

<div class="in" id="appWrap" hidden>
  <div class="shell">
    <nav class="lnb" id="tabs" aria-label="역할 메뉴"></nav>
    <div class="content">
      <div class="ptop">
        <h1 id="ptitle">정비 사용 등록</h1>
        <div class="crumb" id="crumb"></div>
      </div>
      <nav class="flow" id="flow" aria-label="보급 흐름 단계"></nav>
      <div class="note">
        <strong>※ 수리부속 순환보급 안내</strong>
        <ul>
          <li>정비부대가 부속을 쓰면 물류대대 재고가 줄고, 정수에 못 미치는 만큼 중앙 물류에 자동 청구됩니다.</li>
          <li>중앙에 없는 부속은 조달로 넘어가고, 입고되면 밀린 청구에 자동 배분됩니다.</li>
          <li>데이터는 서버(Supabase)에 저장되어 모든 사용자가 같은 내용을 봅니다. 공개 모드에서는 로그인 없이 누구나 보고 처리할 수 있습니다.</li>
        </ul>
      </div>
      <main class="panel" id="panel"></main>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://bcadjhiyszzmaguwlsaw.supabase.co';
// 브라우저용 공개 키입니다. 데이터는 로그인 + 역할(RLS)로 보호됩니다.
const SUPABASE_KEY = 'sb_publishable_VzOt6lFgvAhQbHId5B7rzA_lMzN2v2Y';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EQUIP = ['전술차량 A형 (가상-101)', '전술차량 B형 (가상-207)', '발전기 10kW (가상-G03)', '지게차 3톤 (가상-F12)'];
const ROLE_LABEL = {pending:'승인 대기', unit:'정비부대', bn:'중간 물류대대', central:'중앙 물류', proc:'조달', admin:'관리자', guest:'비로그인'};
const TABS = [
  {id:'unit', label:'정비부대', title:'정비 사용 등록', icon:'M14.7 6.3a4 4 0 0 0-5.2 5.2L4 17v3h3l5.5-5.5a4 4 0 0 0 5.2-5.2l-2.5 2.5-2.2-.5-.5-2.2z'},
  {id:'bn', label:'중간 물류대대', title:'재고 · 정수 관리', icon:'M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z M3 7.5l9 4.5 9-4.5 M12 12v9'},
  {id:'central', label:'중앙 물류', title:'중앙 출고 처리', icon:'M4 21V8l8-5 8 5v13 M9 21v-6h6v6 M9 10h.01 M15 10h.01'},
  {id:'proc', label:'조달', title:'조달 요청 관리', icon:'M3 4h2.5l2.2 11h10.6L20.5 7H6.4 M9.5 20h.01 M17 20h.01'},
  {id:'log', label:'처리 이력', title:'처리 이력', icon:'M9 6h11 M9 12h11 M9 18h11 M4.5 6h.01 M4.5 12h.01 M4.5 18h.01'},
  {id:'account', label:'내 계정', title:'비밀번호 설정', hidden:true},
  {id:'users', label:'사용자 관리', title:'사용자 관리', admin:true, icon:'M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19 M10 10.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M20 19v-1.5a3.5 3.5 0 0 0-2.5-3.35 M15.5 4.6a3 3 0 0 1 0 5.8'}
];

let S = null, me = null, users = [], tab = 'unit', flash = {}, gateMsg = null, busy = false, startedFor, publicMode = false;
// 단계 박스 중 선택된 것 (메뉴로 이동하면 그 메뉴의 첫 단계)
const STAGE_OF_TAB = {unit:0, bn:1, central:3, proc:4};
let stageSel = null;
let form = {equip:EQUIP[0], part:'P01'};

const pad = n => String(n).padStart(2,'0');
const fmt = ts => { const d = new Date(ts); return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// 재고번호: 대시·공백은 무시하고 숫자 13자리
const nsnOk = s => String(s).replace(/\D/g, '').length === 13;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const part = id => S.parts.find(p => p.id === id);
const need = p => p.auth > 0 && p.onHand + p.pending <= p.rop;
const recommend = p => Math.ceil(p.monthly / 30 * (p.lead + 15));
const can = role => publicMode || (me && (me.role === 'admin' || me.role === role));
const lock = role => can(role) ? '' : ` disabled title="${ROLE_LABEL[role]} 역할만 할 수 있습니다"`;
const roNote = role => can(role) ? '' : `<p class="msg info">읽기 전용입니다. 이 화면의 작업은 ${ROLE_LABEL[role]} 역할만 할 수 있습니다. (내 역할: ${ROLE_LABEL[me.role]})</p>`;
// 장비·품목·자체 재고 관리는 공개 모드여도 로그인한 정비부대 사용자(또는 관리자)만
const canManage = () => !!(me && me.id && (me.role === 'admin' || me.role === 'unit'));
const mlock = () => canManage() ? '' : ' disabled';
const manageNote = () => canManage() ? '' : `<p class="msg info">${me && me.id
  ? `정비부대 역할의 사용자만 수정할 수 있습니다. (내 역할: ${ROLE_LABEL[me.role]})`
  : '보기만 할 수 있습니다. 수정은 로그인한 정비부대 사용자만 할 수 있습니다. 오른쪽 위 로그인 버튼으로 로그인하세요.'}</p>`;

function stockState(p){
  if (!p.auth) return {label:'정수 미설정', c:'mute'};
  if (p.onHand === 0) return {label:'결품', c:'crit'};
  if (need(p)) return {label:'청구 필요', c:'warn'};
  if (p.onHand <= p.rop) return {label:'보충 대기', c:'info'};
  return {label:'정상', c:'ok'};
}

/* ---------- 로그인 ---------- */
async function start(session){
  const uid = session?.user?.id || null;
  if (uid === startedFor) return;
  startedFor = uid;
  const pm = await sb.rpc('public_mode');
  publicMode = pm.data === true;
  if (!session) {
    if (publicMode) { enterGuest(); return; }
    me = null; S = null; showGate(loginView()); return;
  }
  const { data } = await sb.from('profiles').select('id,email,role').eq('id', uid).maybeSingle();
  me = data || {id:uid, email:session.user.email, role:'pending'};
  if (me.role === 'pending' && !publicMode) { showGate(pendingView()); return; }
  try { await reload(); } catch (e) { showGate(`<p class="msg crit">데이터를 불러오지 못했습니다: ${esc(e.message)}</p>`); }
}

async function enterGuest(){
  me = {id:null, email:null, role:'guest'};
  try { await reload(); } catch (e) { showGate(`<p class="msg crit">데이터를 불러오지 못했습니다: ${esc(e.message)}</p>`); }
}

}

function authError(error){
  const m = error.message || '';
  if (/invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않습니다. 로그인 링크로만 들어왔던 계정이면 아직 비밀번호가 없습니다.';
  if (/email not confirmed/i.test(m)) return '가입 확인 메일의 링크를 먼저 눌러 주세요.';
  if (/already registered/i.test(m)) return '이미 가입된 이메일입니다. 비밀번호로 로그인하거나, 로그인 링크로 들어와 비밀번호를 정하세요.';
  if (/rate limit/i.test(m)) return '메일 발송 한도를 넘었습니다. 약 1시간 뒤 다시 시도하거나 비밀번호로 로그인하세요.';
  if (/should be different/i.test(m)) return '지금 비밀번호와 다른 비밀번호를 입력하세요.';
  if (/at least/i.test(m)) return '비밀번호는 8자 이상이어야 합니다.';
  return m;
}

/* ---------- 데이터 ---------- */
async function reload(){
  const q = (t, sel = '*', order) => { let x = sb.from(t).select(sel); if (order) x = x.order(order, {ascending:true}); return x; };
  const res = await Promise.all([
    q('parts', '*', 'id'), q('stock_levels'), q('usage_logs', '*', 'created_at'),
    q('requisitions', '*, requisition_items(*)', 'created_at'), q('shipments', '*', 'created_at'),
    q('procurements', '*', 'created_at'), q('status_history', '*', 'created_at'), q('equipment', '*', 'id'),
    me.role === 'admin' ? q('profiles', 'id,email,role,created_at', 'created_at') : Promise.resolve({data:[]})
  ]);
  const bad = res.find(r => r.error);
  if (bad) throw bad.error;
  const [parts, stock, usage, reqs, ships, procs, logs, equip, profs] = res.map(r => r.data);
  const st = (u, p) => stock.find(s => s.unit_id === u && s.part_id === p) || {};
  S = {
    equipment: equip.map(e => ({id:e.id, nsn:e.nsn, name:e.name, active:e.active})),
    parts: parts.map(p => { const b = st('BN', p.id), c = st('CENTRAL', p.id), m = st('MC1', p.id);
      return {id:p.id, nsn:p.nsn, name:p.name, unit:p.unit, lead:p.lead_days, monthly:p.monthly_use, own:m.on_hand ?? 0,
              onHand:b.on_hand ?? 0, pending:b.pending ?? 0, auth:b.authorized_qty ?? 0, rop:b.reorder_point ?? 0, central:c.on_hand ?? 0}; }),
    usage: usage.map(u => ({id:u.id, t:fmt(u.created_at), equip:u.equipment, partId:u.part_id, qty:u.qty, note:u.note || ''})),
    reqs: reqs.map(r => ({id:r.id, t:fmt(r.created_at), type:r.type, status:r.status,
      lines:r.requisition_items.sort((a, b) => a.id - b.id).map(i => ({partId:i.part_id, qty:i.qty, issued:i.issued, backorder:i.backorder, received:i.received}))})),
    shipments: ships.map(s => ({id:s.id, t:fmt(s.created_at), reqId:s.requisition_id, partId:s.part_id, qty:s.qty, status:s.status})),
    procs: procs.map(x => ({id:x.id, t:fmt(x.created_at), partId:x.part_id, qty:x.qty, status:x.status, refs:x.requisition_refs || []})),
    log: logs.map(l => ({t:fmt(l.created_at), who:l.actor, msg:l.message}))
  };
  users = profs;
  if (!S.parts.some(p => p.id === form.part) && S.parts[0]) form.part = S.parts[0].id;
  document.getElementById('gateWrap').hidden = true;
  document.getElementById('appWrap').hidden = false;
  render();
}

async function call(fn, args, key, ok){
  if (busy) return;
  busy = true; document.body.classList.add('busy');
  flash = {};
  const { data, error } = await sb.rpc(fn, args);
  if (error) flash[key] = {c:'crit', t:error.message};
  else if (ok) flash[key] = typeof ok === 'function' ? ok(data) : ok;
  try { await reload(); }
  catch (e) { flash[key] = {c:'crit', t:'데이터를 다시 불러오지 못했습니다: ' + e.message}; render(); }
  busy = false; document.body.classList.remove('busy');
}

    const rec = recommend(p);
    return `<tr>
      <td class="mono">${p.nsn}</td><td class="l">${esc(p.name)}</td>
      <td class="num">${p.onHand}</td><td class="num">${p.pending || '–'}</td>
      <td class="num"><input class="cell-in" type="number" min="1" id="auth-${p.id}" data-edit="${p.id}" value="${p.auth}" aria-label="${esc(p.name)} 정수"${lock('bn')}></td>
      <td class="num"><input class="cell-in" type="number" min="0" id="rop-${p.id}" data-edit="${p.id}" value="${p.rop}" aria-label="${esc(p.name)} 재청구점"${lock('bn')}></td>
      <td class="num" title="월 소모 ${p.monthly} × (조달 ${p.lead}일 + 안전 15일) ÷ 30">${rec}${rec !== p.auth ? ` <span class="mono">(${rec > p.auth ? '+' : ''}${rec - p.auth})</span>` : ''}</td>
      <td><div class="meter${mc}" title="보유 ${p.onHand} / 정수 ${p.auth}, 표시선 = 재청구점"><i class="p" style="width:${w(p.onHand + p.pending)}%"></i><i style="width:${w(p.onHand)}%"></i><b style="left:${w(p.rop)}%"></b></div></td>
      <td>${chip(s.label, s.c)}</td></tr>`;
  }).join('');

  const waiting = S.reqs.filter(r => r.status === '확인대기');
  const transit = S.shipments.filter(s => s.status === '수송중');
  const all = S.reqs.slice().reverse().map(r => {
    const tot = r.lines.reduce((a, l) => a + l.qty, 0), got = r.lines.reduce((a, l) => a + l.received, 0);
    return `<tr><td class="mono">${r.id}</td><td class="mono">${r.t}</td><td>${r.type}</td>
      <td class="l">${r.lines.map(l => esc(part(l.partId).name)).join(', ')}</td>
      <td class="num">${got}/${tot}</td><td>${chip(r.status, REQ_C[r.status])}</td></tr>`;
  }).join('');

  return `<section class="card">
      <div class="head">
        <div><h2>재고 · 정수 현황</h2><p class="hint">정수와 재청구점은 표에서 바로 고칠 수 있습니다. 막대: 진한 색 = 보유, 옅은 색 = 청구중 포함, 세로선 = 재청구점.</p></div>
        <button class="btn primary" type="button" data-act="auto"${lock('bn')}>자동 청구 실행</button>
      </div>
      ${roNote('bn')}
      <div class="formula">조건: 보유 + 청구중 ≤ 재청구점 → 청구량 = 정수 − (보유 + 청구중)</div>
      ${msg('bn')}
      <div class="tbl"><table><thead><tr><th>재고번호</th><th>품명</th><th class="num">보유</th><th class="num">청구중</th><th class="num">정수</th><th class="num">재청구점</th><th class="num">추천 정수</th><th>보유율</th><th>상태</th></tr></thead><tbody>${inv}</tbody></table></div>
    </section>
    <div class="grid2">
      <section class="card">
        <div class="head"><div><h2>확인 대기 청구</h2><p class="hint">자동 생성된 청구서를 담당자가 확인해야 중앙으로 넘어갑니다.</p></div></div>
        ${waiting.length ? `<div class="docs">${waiting.map(r => `<div class="doc">
          <div class="doc-h"><span class="id">${r.id}</span><span class="mono">${r.t} · ${r.type}</span></div>
          ${reqLines(r)}
          <div class="actions"><button class="btn sm" type="button" data-act="cancel" data-id="${r.id}"${lock('bn')}>취소</button><button class="btn primary sm" type="button" data-act="confirm" data-id="${r.id}"${lock('bn')}>확인 후 중앙 전송</button></div>
        </div>`).join('')}</div>` : `<p class="empty">대기 중인 청구가 없습니다. 위에서 '자동 청구 실행'을 눌러 보세요.</p>`}
      </section>
      <section class="card">
        <div class="head"><div><h2>수송 중 (수령 대기)</h2><p class="hint">물건을 받으면 수령 확인을 눌러 재고에 반영합니다.</p></div></div>
        ${transit.length ? `<div class="docs">${transit.map(s => { const p = part(s.partId); return `<div class="doc">
          <div class="doc-h"><span class="id">${s.id}</span><span class="mono">${s.t} · ${s.reqId}</span></div>
          <ul><li><span>${esc(p.name)}</span><span>${s.qty}${p.unit}</span></li></ul>
          <div class="actions"><button class="btn primary sm" type="button" data-act="receive" data-id="${s.id}"${lock('bn')}>수령 확인</button></div>
        </div>`; }).join('')}</div>` : `<p class="empty">수송 중인 부속이 없습니다.</p>`}
      </section>
    </div>
    <section class="card">
      <div class="head"><div><h2>청구 현황</h2><p class="hint">물류대대가 중앙으로 보낸 모든 청구입니다.</p></div></div>
      ${all ? `<div class="tbl"><table><thead><tr><th>문서번호</th><th>생성</th><th>구분</th><th>품목</th><th class="num">수령/청구</th><th>상태</th></tr></thead><tbody>${all}</tbody></table></div>` : '<p class="empty">청구가 없습니다.</p>'}
    </section>`;
}

function panelCentral(){
  const inbox = S.reqs.filter(r => r.status === '중앙접수');
  const bo = [];
  S.reqs.filter(r => r.status === '처리중').forEach(r => r.lines.filter(l => l.backorder > 0).forEach(l => bo.push({r, l})));
  const stock = S.parts.map(p => `<tr><td class="mono">${p.nsn}</td><td class="l">${esc(p.name)}</td>
    <td class="num">${p.central}${p.unit}</td><td class="num">${p.lead}일</td><td>${p.central === 0 ? chip('결품', 'crit') : chip('보유', 'ok')}</td></tr>`).join('');
  return `${roNote('central')}<div class="grid2">
      <section class="card">
        <div class="head"><div><h2>접수된 청구</h2><p class="hint">중앙 재고만큼 출고하고, 모자란 수량은 미결로 남겨 조달요청을 만듭니다.</p></div></div>
        ${msg('central')}
        ${inbox.length ? `<div class="docs">${inbox.map(r => `<div class="doc">
          <div class="doc-h"><span class="id">${r.id}</span><span class="mono">${r.t} · 중간 물류대대</span></div>
          ${reqLines(r, 'central')}
          <div class="actions"><button class="btn primary sm" type="button" data-act="process" data-id="${r.id}"${lock('central')}>출고 처리</button></div>
        </div>`).join('')}</div>` : `<p class="empty">처리할 청구가 없습니다. 물류대대에서 청구를 확인하면 여기에 나타납니다.</p>`}
      </section>
      <section class="card">
        <div class="head"><div><h2>미결 청구</h2><p class="hint">조달품이 입고되면 오래된 청구부터 자동 배분됩니다.</p></div></div>
        ${bo.length ? `<div class="tbl"><table><thead><tr><th>청구</th><th>품명</th><th class="num">미결</th></tr></thead><tbody>${bo.map(({r, l}) => `<tr><td class="mono">${r.id}</td><td class="l">${esc(part(l.partId).name)}</td><td class="num">${l.backorder}${part(l.partId).unit}</td></tr>`).join('')}</tbody></table></div>` : `<p class="empty">미결 청구가 없습니다.</p>`}
      </section>
    </div>
    <section class="card">
      <div class="head"><div><h2>중앙 재고</h2></div></div>
      <div class="tbl"><table><thead><tr><th>재고번호</th><th>품명</th><th class="num">중앙 보유</th><th class="num">조달 소요</th><th>상태</th></tr></thead><tbody>${stock}</tbody></table></div>
    </section>`;
}

function panelProc(){
  const rows = S.procs.slice().reverse().map(x => {
    const p = part(x.partId);
    const btn = x.status === '요청' ? `<button class="btn sm" type="button" data-act="proc" data-id="${x.id}"${lock('proc')}>계약 진행</button>`
      : x.status === '계약진행' ? `<button class="btn primary sm" type="button" data-act="proc" data-id="${x.id}"${lock('proc')}>입고 처리</button>` : '';
    return `<tr><td class="mono">${x.id}</td><td class="mono">${x.t}</td><td class="l">${esc(p.name)}</td><td class="num">${x.qty}${p.unit}</td>
      <td class="mono">${x.refs.join(', ')}</td><td>${chip(x.status, PRC_C[x.status])}</td><td>${btn}</td></tr>`;
  }).join('');
  return `<section class="card">
    <div class="head"><div><h2>조달 요청</h2><p class="hint">같은 품목의 부족분은 '요청' 단계에 있는 동안 한 건으로 합쳐집니다. 입고 처리하면 중앙 재고에 더해지고 미결 청구로 자동 배분됩니다.</p></div></div>
    ${roNote('proc')}
    ${msg('proc')}
    ${rows ? `<div class="tbl"><table><thead><tr><th>문서번호</th><th>생성</th><th>품명</th><th class="num">수량</th><th>관련 청구</th><th>상태</th><th>처리</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty">조달 요청이 없습니다.</p>`}
  </section>`;
}

function panelLog(){
  return `<section class="card">
    <div class="head"><div><h2>처리 이력</h2><p class="hint">누가 언제 무엇을 했는지 최신순으로 보여줍니다. 서버에 기록되어 지울 수 없습니다.</p></div></div>
    ${S.log.length ? `<ul class="log">${S.log.slice().reverse().map(x => `<li><span class="mono">${x.t}</span><span>${chip(x.who, 'mute')}</span><span>${esc(x.msg)}</span></li>`).join('')}</ul>` : '<p class="empty">이력이 없습니다.</p>'}
  </section>`;
}

function panelUsers(){
  const opts = cur => Object.keys(ROLE_LABEL).map(r => `<option value="${r}"${r === cur ? ' selected' : ''}>${ROLE_LABEL[r]}</option>`).join('');
  const rows = users.map(u => `<tr><td class="l">${esc(u.email || '')}${u.id === me.id ? ' <span class="mono">(나)</span>' : ''}</td>
    <td><select data-role="${u.id}" aria-label="${esc(u.email || '')} 역할">${opts(u.role)}</select></td>
    <td class="mono">${fmt(u.created_at)}</td></tr>`).join('');
  return `<section class="card">
    <div class="head"><div><h2>사용자 역할</h2><p class="hint">처음 로그인한 사람은 '승인 대기'입니다. 역할을 고르면 바로 저장됩니다. 역할에 맞는 화면의 작업만 할 수 있고, 관리자는 모든 작업을 할 수 있습니다.</p></div></div>
    ${msg('users')}
    <div class="tbl"><table><thead><tr><th>이메일</th><th>역할</th><th>가입</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;

function panelAccount(){
  return `<section class="card">
    <div class="head"><div><h2>비밀번호 설정</h2><p class="hint">${esc(me.email)} 계정의 비밀번호를 정하거나 바꿉니다. 저장하면 다음부터 메일 없이 이메일과 비밀번호로 로그인할 수 있습니다.</p></div></div>
    ${passwordForm()}
  </section>`;
}

function render(){
  renderWho(); renderFlow(); renderTabs();
  const P = {unit:panelUnit, bn:panelBn, central:panelCentral, proc:panelProc, log:panelLog, users:panelUsers, account:panelAccount};
  document.getElementById('panel').innerHTML = P[tab]();
}

function go(t, stage){
  tab = t; flash = {};
  stageSel = stage != null ? Number(stage) : (STAGE_OF_TAB[t] ?? -1);
  try { history.replaceState(null, '', '#' + t); } catch (e) {}
  render();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { go(t.dataset.tab, t.dataset.stage); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const {act, id} = b.dataset;
  if (act === 'logout') { sb.auth.signOut(); return; }
  if (act === 'mode') { authMode = b.dataset.mode; gateMsg = null; showGate(loginView()); return; }
  if (act === 'login') { authMode = 'password'; gateMsg = null; showGate(loginView()); return; }
  if (act === 'guest') { enterGuest(); return; }
  if (act === 'account') { go('account'); return; }
  if (act === 'reset') call('reset_demo', {}, 'unit', {c:'info', t:'처음 상태로 되돌렸습니다.'}).then(() => go('unit'));
  if (act === 'savepart' || act === 'addpart') {
    const k = act === 'addpart' ? 'new' : id;
    const v = f => document.getElementById(`${f}-${k}`).value;
    if (!nsnOk(v('pnsn'))) { flash = {parts:{c:'crit', t:'재고번호는 숫자 13자리로 입력하세요.'}}; render(); return; }
    call('save_part', {p_id:act === 'addpart' ? null : id, p_nsn:v('pnsn'), p_name:v('pname'), p_unit:v('punit'),
      p_lead:parseInt(v('plead'), 10), p_monthly:parseInt(v('pmon'), 10)}, 'parts', nsn => act === 'addpart'
      ? {c:'ok', t:`${nsn} 품목을 추가했습니다. 물류대대 화면에서 정수와 재청구점을 정하세요.`}
      : {c:'ok', t:`${nsn} 품목을 저장했습니다.`});
  }
  if (act === 'saveeq' || act === 'addeq') {
    const k = act === 'addeq' ? 'new' : id;
    const nsn = document.getElementById('eqn-' + k).value;
    if (!nsnOk(nsn)) { flash = {equip:{c:'crit', t:'재고번호는 숫자 13자리로 입력하세요.'}}; render(); return; }
    call('save_equipment', {p_id:act === 'addeq' ? null : Number(id), p_nsn:nsn, p_name:document.getElementById('eq-' + k).value,
      p_active:act === 'addeq' ? true : document.getElementById('eqa-' + k).checked}, 'equip',
      n => ({c:'ok', t:act === 'addeq' ? `${n} 장비를 등록했습니다.` : `${n} 장비 정보를 저장했습니다.`}));
  }
  if (act === 'auto') call('auto_requisition', {}, 'bn', rid => rid
    ? {c:'ok', t:`${rid} 생성. 아래 '확인 대기 청구'에서 확인하면 중앙 물류로 전송됩니다.`}
    : {c:'info', t:'모든 품목이 재청구점보다 많아 청구할 품목이 없습니다.'});
  if (act === 'confirm') call('confirm_requisition', {p_id:id}, 'bn', {c:'ok', t:`${id}를 중앙 물류로 보냈습니다. '중앙 물류' 메뉴에서 출고 처리할 수 있습니다.`});
  if (act === 'cancel') call('cancel_requisition', {p_id:id}, 'bn', {c:'info', t:`${id}를 취소했습니다. 청구중 수량이 원래대로 돌아갔습니다.`});
  if (act === 'process') call('process_requisition', {p_id:id}, 'central', d =>
    ({c:d.backorder ? 'warn' : 'ok', t:`${id} 처리 완료. 출고 ${d.issued}건, 미결 ${d.backorder}건${d.backorder ? ' (조달 메뉴로 넘어갔습니다)' : ''}.`}));
  if (act === 'proc') call('advance_procurement', {p_id:id}, 'proc', d => d.status === '계약진행'
    ? {c:'info', t:`${id} 계약을 진행합니다. 납품되면 '입고 처리'를 누르세요.`}
    : {c:'ok', t:`${d.name} ${d.qty}${d.unit} 중앙 입고. 미결 청구 ${d.allocated}건에 자동 배분되어 물류대대로 출고되었습니다.`});
  if (act === 'receive') call('receive_shipment', {p_id:id}, 'bn', d =>
    ({c:'ok', t:`${d.name} ${d.qty}${d.unit} 수령. 대대 보유 ${d.on_hand}${d.unit}.${d.done ? ` ${d.req} 청구가 모두 충족되었습니다.` : ''}`}));
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') {
    const email = document.getElementById('f-email').value.trim();
    const pw = document.getElementById('f-pw')?.value || '';
    const btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true;
    const redirect = location.origin + location.pathname;
    if (authMode === 'signup' && pw !== document.getElementById('f-pw2').value) {
      gateMsg = {c:'crit', t:'비밀번호 확인이 일치하지 않습니다.'};
    } else if (authMode === 'password') {
      const { error } = await sb.auth.signInWithPassword({email, password:pw});
      gateMsg = error ? {c:'crit', t:authError(error)} : null;
      if (!error) return;
    } else if (authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:redirect}});
      if (error) gateMsg = {c:'crit', t:authError(error)};
      else if (data.session) return;
      else { authMode = 'password'; gateMsg = {c:'ok', t:`${email}로 가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 비밀번호로 로그인하세요.`}; }
    } else {
      const { error } = await sb.auth.signInWithOtp({email, options:{emailRedirectTo:redirect}});
      gateMsg = error ? {c:'crit', t:'로그인 링크를 보내지 못했습니다: ' + authError(error)}
                      : {c:'ok', t:`${email}로 로그인 링크를 보냈습니다. 메일함(스팸함 포함)을 확인해 주세요.`};
    }
    showGate(loginView());
    const f = document.getElementById('f-email'); if (f) f.value = email;
    return;
  }
  if (e.target.id === 'pwForm') {
    const pw = document.getElementById('f-newpw').value, pw2 = document.getElementById('f-newpw2').value;
    flash = {};
    if (pw.length < 8) flash.account = {c:'crit', t:'비밀번호는 8자 이상이어야 합니다.'};
    else if (pw !== pw2) flash.account = {c:'crit', t:'비밀번호 확인이 일치하지 않습니다.'};
    else {
      const { error } = await sb.auth.updateUser({password:pw});
      flash.account = error ? {c:'crit', t:authError(error)} : {c:'ok', t:'비밀번호를 저장했습니다. 다음부터 이메일과 비밀번호로 로그인할 수 있습니다.'};
    }
    if (me.role === 'pending') showGate(pendingView()); else render();
    return;
  }
  if (e.target.id === 'useForm') {
    form.equip = document.getElementById('f-equip').value;
    form.part = document.getElementById('f-part').value;
    const p = part(form.part), wasNeed = need(p);
    const qty = parseInt(document.getElementById('f-qty').value, 10);
    call('use_parts', {p_equipment:form.equip, p_part:form.part, p_qty:qty, p_note:document.getElementById('f-note').value.trim()}, 'unit', d =>
      ({c:d.need && d.bn_used ? 'warn' : 'ok', t:`${p.name} ${qty}${p.unit} 사용 등록. 자체 재고 ${d.own_used}${p.unit}, 물류대대 불출 ${d.bn_used}${p.unit} (자체 남음 ${d.own_left}, 대대 보유 ${d.on_hand}).${d.need && !wasNeed ? ` 대대 재고가 재청구점(${p.rop}) 이하가 되어 다음 자동 청구에 포함됩니다.` : ''}`}));
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'f-equip') form.equip = el.value;
  if (el.id === 'f-part') form.part = el.value;
  if (el.dataset.edit) {
    const pid = el.dataset.edit;
    const auth = parseInt(document.getElementById('auth-' + pid).value, 10);
    const rop = parseInt(document.getElementById('rop-' + pid).value, 10);
    call('set_stock_level', {p_part:pid, p_auth:auth, p_rop:rop}, 'bn', {c:'ok', t:`${part(pid).name} 정수 ${auth}, 재청구점 ${rop}로 바꿨습니다.`});
  }
  if (el.dataset.own) {
    const pid = el.dataset.own, q = parseInt(el.value, 10);
    call('set_unit_stock', {p_part:pid, p_qty:q}, 'own', {c:'ok', t:`${part(pid).name} 자체 보유를 ${q}${part(pid).unit}(으)로 바꿨습니다.`});
  }
  if (el.dataset.role) {
    call('set_user_role', {p_user:el.dataset.role, p_role:el.value}, 'users', {c:'ok', t:'역할을 바꿨습니다.'});
  }
});

const h = location.hash.slice(1);
if (TABS.some(t => t.id === h)) tab = h;
sb.auth.onAuthStateChange((_event, session) => { setTimeout(() => start(session), 0); });
</script>
</body>
